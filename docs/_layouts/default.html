<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">
  <title>{{ page.title | escape }} · Hibike</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #000; color: #eee; }
    body { max-width: 960px; margin: auto; padding: 24px; line-height: 1.7; overflow-wrap: anywhere; }
    main { padding: 16px 0 32px; }
    h1 { font-size: clamp(32px, 6vw, 56px); letter-spacing: -.04em; }
    p, li { color: #bbb; }
    nav a { display: inline-flex; align-items: center; min-height: 48px; }
    nav a:first-child { font-size: 24px; font-weight: 650; text-decoration: none; }
    nav, footer { display: flex; flex-wrap: wrap; gap: 12px 24px; padding: 16px 0; }
    nav { border-bottom: 1px solid #333; }
    footer { border-top: 1px solid #333; margin-top: 40px; }
    a { color: #eee; text-underline-offset: 4px; }
    a:hover { color: #fff; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
    h1, h2 { line-height: 1.25; }
    h1 { margin-top: 36px; }
    h2 { margin-top: 32px; }
    code { white-space: pre-wrap; }
    .skip { position: absolute; top: -100px; }
    .skip:focus { top: 0; background: #000; padding: 12px; }
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <nav aria-label="Main navigation">
    <a href="{{ '/' | relative_url }}">Hibike</a>
    <a href="{{ '/app/' | relative_url }}">Avalonia experience</a>
    <a href="{{ '/privacy.html' | relative_url }}">Privacy Policy</a>
    <a href="{{ '/terms.html' | relative_url }}">Terms of Service</a>
    <a href="https://github.com/flugeru/Hibike">Source code</a>
  </nav>
  <main id="content">{{ content }}</main>
  <footer><a href="https://github.com/flugeru/Hibike/issues">Contact the maintainer</a></footer>
</body>
</html>
