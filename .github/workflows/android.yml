name: Hibike • Android APK

on:
  push:
    branches: [main, work-next, feat/experimental-player-lab, queue-fix, android-player-features, refactor-library-downloads]
    paths: ['src/**', 'tests/**', 'scripts/**', 'Directory.*', 'global.json', 'Hibike.slnx', '.github/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'Directory.*', 'global.json', 'Hibike.slnx', '.github/**']
  workflow_dispatch:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      ANDROID_STORE_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test core and build Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android workload and SDK
        run: |
          dotnet workload install android
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify source structure
        run: python3 scripts/check_source.py
      - name: Run core behavior tests
        run: dotnet test tests/Hibike.Core.Tests/Hibike.Core.Tests.csproj -c Release --logger "trx;LogFileName=core.trx" --results-directory artifacts/tests
      - name: Prepare verified Python, QuickJS and YT-DLP
        run: python3 scripts/prepare_android_runtime.py --abi arm64-v8a
      # Pull requests must never access the production signing secrets.
      # Create a temporary test key and publish a separately signed APK for device testing.
      - name: Publish installable test APK for pull request
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/hibike-pr-test.jks" \
            -storepass android -keypass android -alias hibike-test \
            -keyalg RSA -keysize 3072 -validity 30 -dname "CN=Hibike Test,O=Hibike,C=BR"
          dotnet publish src/Hibike.Android/Hibike.Android.csproj \
            -f net10.0-android -c Release -r android-arm64 \
            -p:RuntimeIdentifiers=android-arm64 \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/hibike-pr-test.jks" \
            -p:AndroidSigningKeyAlias=hibike-test \
            -p:AndroidSigningKeyPass=android \
            -p:AndroidSigningStorePass=android \
            -o artifacts/pr-android
      - name: Verify and prepare pull request APK
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find artifacts/pr-android -maxdepth 1 -name '*-Signed.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee artifacts/pr-android/package-info.txt
          grep -q "package: name='com.flugel.hibike'" artifacts/pr-android/package-info.txt
          grep -q "sdkVersion:'24'" artifacts/pr-android/package-info.txt
          python3 scripts/check_apk.py "$apk"
          mkdir -p artifacts/pr-release
          cp "$apk" artifacts/pr-release/Hibike-Android-arm64-TEST.apk
      - name: Upload installable pull request APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Hibike-Android-arm64-TEST
          path: artifacts/pr-release/Hibike-Android-arm64-TEST.apk
          if-no-files-found: error
          retention-days: 30
      - name: Restore signing key from Secrets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" && test -n "$STORE_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hibike-signing.jks"
          keytool -exportcert -keystore "$RUNNER_TEMP/hibike-signing.jks" -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD > "$RUNNER_TEMP/hibike-signing.der"
          echo "8dd0de091c98a3d8d969ac88dddf9fe6c2afa23edccb1df4d737d91d0480f98c  $RUNNER_TEMP/hibike-signing.der" | sha256sum --check
      - name: Publish signed APK
        if: github.event_name != 'pull_request'
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          dotnet publish src/Hibike.Android/Hibike.Android.csproj \
            -f net10.0-android -c Release -r android-arm64 \
            -p:RuntimeIdentifiers=android-arm64 \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:ApplicationVersion=$((20261181 + GITHUB_RUN_NUMBER)) \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/hibike-signing.jks" \
            -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:KEY_PASSWORD \
            -p:AndroidSigningStorePass=env:STORE_PASSWORD \
            -o artifacts/android
      - name: Validate APK and bundled engine
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find artifacts/android -maxdepth 1 -name '*-Signed.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | tee artifacts/android/signing-certificate.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee artifacts/android/package-info.txt
          grep -q "package: name='com.flugel.hibike'" artifacts/android/package-info.txt
          grep -q "sdkVersion:'24'" artifacts/android/package-info.txt
          python3 scripts/check_apk.py "$apk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex code --class androidx.core.view.ViewCompat "$apk" > artifacts/android/view-compat.smali
          grep -Fq '.method public static setWindowInsetsAnimationCallback(Landroid/view/View;Landroidx/core/view/WindowInsetsAnimationCompat$Callback;)V' artifacts/android/view-compat.smali
          mkdir -p artifacts/release
          cp "$apk" artifacts/release/Hibike-Android-arm64.apk
          cp artifacts/android/signing-certificate.txt artifacts/release/signing-certificate.txt
      - name: Upload installable APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Hibike-Android-arm64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/hibike-signing.jks" "$RUNNER_TEMP/hibike-signing.der"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hibike-core-tests
          path: artifacts/tests/**
          if-no-files-found: ignore
