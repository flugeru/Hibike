name: Hibike Linux AppImage

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'packaging/**', 'Directory.*', 'global.json', 'Hibike.slnx', '.github/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'packaging/**', 'Directory.*', 'global.json', 'Hibike.slnx', '.github/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux runtime and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc5 vlc-plugin-base vlc-plugin-video-output libx11-6 libice6 libsm6 libfontconfig1 libglib2.0-0 libgl1 libxrandr2 libxi6 libxcursor1 libxext6 xvfb desktop-file-utils python3
      - name: Test core and source structure
        run: |
          python3 scripts/check_source.py
          dotnet test tests/Hibike.Core.Tests -c Release
          dotnet run --project tests/Hibike.Ui.Checks -c Release -- --headless
          dotnet run --project tests/Hibike.LocalAudio.Checks -c Release -- --presence-only
      - name: Build AppImage
        run: |
          bash scripts/publish_linux.sh
          cp packaging/linux/README.md artifacts/README-Linux.md
      - name: Check extracted AppImage startup
        env:
          HIBIKE_DISCORD_RPC: '0'
        run: |
          set -euo pipefail
          mkdir artifacts/linux-smoke
          cd artifacts/linux-smoke
          ../Hibike-x86_64.AppImage --appimage-extract > extraction.log
          test -x squashfs-root/AppRun
          test -f squashfs-root/hibike.desktop
          set +e
          timeout 15s xvfb-run -a squashfs-root/AppRun > startup.log 2>&1
          result=$?
          set -e
          cat startup.log
          test "$result" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: Hibike-Linux-x64
          path: |
            artifacts/Hibike-x86_64.AppImage
            artifacts/README-Linux.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Hibike-Linux-diagnostics
          path: artifacts/linux-smoke/*.log
          if-no-files-found: ignore
