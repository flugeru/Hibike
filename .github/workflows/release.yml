name: Hibike release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  android:
    uses: ./.github/workflows/android.yml
  release:
    needs: [windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Hibike-Windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Hibike-Windows-Setup-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Hibike-Android-arm64
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          (cd release && sha256sum *.exe *.zip *.apk > SHA256SUMS.txt)
          cat > notes.txt <<'EOF'
          ## Hibike 0.1.0

          Primeira versão pública experimental para Windows x64 e Android ARM64.

          - Player AMOLED, biblioteca local, favoritos, playlists e fila persistente.
          - Busca musical, rádio e reprodução pelos provedores integrados.
          - Onboarding de artistas/gêneros, perfil local e Início personalizado sem conta.
          - Rankings públicos YouTube Music com cache e identificação da fonte.

          ### Downloads
          - **Hibike-Setup-x64.exe**: instalador Windows.
          - **Hibike-win-x64.zip**: Windows portátil; extraia antes de executar.
          - **Hibike-Android-arm64.apk**: Android 7.0 ou superior, ARM64.
          - **SHA256SUMS.txt**: hashes dos arquivos; **signing-certificate.txt**: certificado Android.

          ### Limitações conhecidas
          Login Google e seletor experimental de fontes estão ocultos. Descoberta e rankings usam integração não oficial do YouTube Music e podem ficar indisponíveis. APK usa chave de desenvolvimento do CI; pode não atualizar APKs locais assinados com outra chave. Não desinstale uma instalação existente sem preservar seus dados. Testes em emulador não fazem parte desta publicação.
          EOF
          gh release create "$tag" release/* --verify-tag --title "Hibike ${tag#v}" --notes-file notes.txt --latest
