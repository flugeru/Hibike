name: Hibike release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  android:
    uses: ./.github/workflows/android.yml
  linux:
    uses: ./.github/workflows/linux.yml
  release:
    needs: [windows, android, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Hibike-Windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Hibike-Windows-Setup-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Hibike-Android-arm64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Hibike-libmpv-source
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Hibike-Linux-x64
          path: release/linux
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mv release/linux/Hibike-x86_64.AppImage release/
          mv release/linux/README-Linux.md release/README-Linux.md
          rmdir release/linux
          (cd release && sha256sum *.exe *.zip *.apk *.tar.xz *.AppImage > SHA256SUMS.txt)
          cat > notes.txt <<'EOF'
          ## Hibike 0.2.0

          Atualização experimental para Windows x64 e Android ARM64.

          - Player AMOLED, biblioteca local, favoritos, playlists e fila persistente.
          - Busca musical, rádio e reprodução pelos provedores integrados.
          - Onboarding de artistas/gêneros, perfil local e Início personalizado sem conta.
          - Login Google opcional com sessão protegida e restauração ao reabrir.
          - Interface responsiva, páginas de conta/configurações e melhorias de busca e coleções.
          - Metadados locais ampliados, informações técnicas do áudio e volume persistente.
          - libmpv padrão no Windows e seleção de motores de áudio nas configurações.
          - Instalador escuro; caixa de progresso exclusiva para atualização e restauração da conta.

          ### Downloads
          - **Hibike-Setup-x64.exe**: instalador Windows.
          - **Hibike-win-x64.zip**: Windows portátil; extraia antes de executar.
          - **Hibike-Android-arm64.apk**: Android 7.0 ou superior, ARM64.
          - **Hibike-x86_64.AppImage**: Linux x86_64 experimental; requer VLC e Python 3 do sistema. Instruções em **README-Linux.md** / experimental Linux build; requires system VLC and Python 3.
          - **SHA256SUMS.txt**: hashes dos arquivos; **signing-certificate.txt**: certificado Android.
          - **libmpv-windows-20261021-1-sources.tar.xz**: fontes correspondentes do libmpv e dependências, com receitas de compilação; não precisa baixar para executar Hibike.

          ### Limitações conhecidas
          Integração Google/YouTube Music não oficial, sujeita a bloqueios, expiração e mudanças do serviço. Sem sincronização completa entre dispositivos. MediaInfo Android não incluído; leitura usa APIs nativas e parser FLAC. MediaInfo no Windows é opcional e não acompanha o download. Motores Windows: libmpv padrão e VLC. APK usa chave de desenvolvimento do CI; pode não atualizar APKs locais assinados com outra chave. Não desinstale uma instalação existente sem preservar seus dados. Cobertura de formatos e persistência Google real ainda exigem validação física.
          EOF
          gh release create "$tag" release/* --verify-tag --title "Hibike ${tag#v}" --notes-file notes.txt --latest
