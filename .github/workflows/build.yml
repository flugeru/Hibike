name: Hibike • Android, Windows and Linux

on:
  push:
    branches: [main, work-next, feat/experimental-player-lab, queue-fix, android-player-features, refactor-library-downloads, android-collapsing-top-bars]
    paths: ['src/**', 'tests/**', 'scripts/**', 'packaging/**', 'LICENSE', 'Directory.*', 'global.json', 'Hibike.slnx', '.github/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'packaging/**', 'LICENSE', 'Directory.*', 'global.json', 'Hibike.slnx', '.github/**']
  workflow_dispatch:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      ANDROID_STORE_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test core and build Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android workload and SDK
        run: |
          dotnet workload install android
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify source structure
        run: python3 scripts/check_source.py
      - name: Run core behavior tests
        run: dotnet test tests/Hibike.Core.Tests/Hibike.Core.Tests.csproj -c Release --logger "trx;LogFileName=core.trx" --results-directory artifacts/tests
      - name: Check Android collapsing toolbars
        run: dotnet run --project tests/Hibike.Ui.Checks -c Release -- --headless --collapsing-top-bars
      - name: Prepare verified Python, QuickJS and YT-DLP
        run: python3 scripts/prepare_android_runtime.py --abi arm64-v8a
      # Pull requests must never access the production signing secrets.
      # Use a separate application ID so the temporary key cannot conflict with the release app.
      - name: Publish installable test APK for pull request
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/hibike-pr-test.jks" \
            -storepass android -keypass android -alias hibike-test \
            -keyalg RSA -keysize 3072 -validity 30 -dname "CN=Hibike Test,O=Hibike,C=BR"
          dotnet publish src/Hibike.Android/Hibike.Android.csproj \
            -f net10.0-android -c Release -r android-arm64 \
            -p:RuntimeIdentifiers=android-arm64 \
            -p:ApplicationId=com.flugel.hibike.test \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/hibike-pr-test.jks" \
            -p:AndroidSigningKeyAlias=hibike-test \
            -p:AndroidSigningKeyPass=android \
            -p:AndroidSigningStorePass=android \
            -o artifacts/pr-android
      - name: Verify and prepare pull request APK
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find artifacts/pr-android -maxdepth 1 -name '*-Signed.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee artifacts/pr-android/package-info.txt
          grep -Fq "package: name='com.flugel.hibike.test'" artifacts/pr-android/package-info.txt
          grep -q "sdkVersion:'24'" artifacts/pr-android/package-info.txt
          python3 scripts/check_apk.py "$apk"
          mkdir -p artifacts/pr-release
          cp "$apk" artifacts/pr-release/Hibike-Android-arm64-TEST.apk
      - name: Upload installable pull request APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Hibike-Android-arm64-TEST
          path: artifacts/pr-release/Hibike-Android-arm64-TEST.apk
          if-no-files-found: error
          retention-days: 30
      - name: Explain how to install the test APK
        if: github.event_name == 'pull_request'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Extract `Hibike-Android-arm64-TEST.apk` from the artifact ZIP. It installs alongside
          the official Hibike app. Each run uses a fresh test key, so uninstall any previous
          `com.flugel.hibike.test` build before installing this one.

          To update the official Hibike app in place, use `Hibike-Android-arm64.apk` from a
          signed branch build or a GitHub release.
          EOF
      - name: Restore signing key from Secrets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" && test -n "$STORE_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hibike-signing.jks"
          keytool -exportcert -keystore "$RUNNER_TEMP/hibike-signing.jks" -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD > "$RUNNER_TEMP/hibike-signing.der"
          echo "8dd0de091c98a3d8d969ac88dddf9fe6c2afa23edccb1df4d737d91d0480f98c  $RUNNER_TEMP/hibike-signing.der" | sha256sum --check
      - name: Publish signed APK
        if: github.event_name != 'pull_request'
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # A renamed workflow gets a new run counter. Keep upgrades monotonic across build and release workflows.
          version_code=$(date -u +%s)
          dotnet publish src/Hibike.Android/Hibike.Android.csproj \
            -f net10.0-android -c Release -r android-arm64 \
            -p:RuntimeIdentifiers=android-arm64 \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:ApplicationVersion="$version_code" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/hibike-signing.jks" \
            -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:KEY_PASSWORD \
            -p:AndroidSigningStorePass=env:STORE_PASSWORD \
            -o artifacts/android
      - name: Validate APK and bundled engine
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find artifacts/android -maxdepth 1 -name '*-Signed.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | tee artifacts/android/signing-certificate.txt
          grep -Fxq "Signer #1 certificate SHA-256 digest: 8dd0de091c98a3d8d969ac88dddf9fe6c2afa23edccb1df4d737d91d0480f98c" artifacts/android/signing-certificate.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee artifacts/android/package-info.txt
          grep -q "package: name='com.flugel.hibike'" artifacts/android/package-info.txt
          grep -q "sdkVersion:'24'" artifacts/android/package-info.txt
          python3 scripts/check_apk.py "$apk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex code --class androidx.core.view.ViewCompat "$apk" > artifacts/android/view-compat.smali
          grep -Fq '.method public static setWindowInsetsAnimationCallback(Landroid/view/View;Landroidx/core/view/WindowInsetsAnimationCompat$Callback;)V' artifacts/android/view-compat.smali
          mkdir -p artifacts/release
          cp "$apk" artifacts/release/Hibike-Android-arm64.apk
          cp artifacts/android/signing-certificate.txt artifacts/release/signing-certificate.txt
      - name: Upload installable APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Hibike-Android-arm64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/hibike-signing.jks" "$RUNNER_TEMP/hibike-signing.der" "$RUNNER_TEMP/hibike-pr-test.jks"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hibike-core-tests
          path: artifacts/tests/**
          if-no-files-found: ignore

  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test core
        run: dotnet test tests/Hibike.Core.Tests --configuration Release
      - name: Check Discord payload
        run: dotnet run --project tests/Hibike.LocalAudio.Checks -- --presence-only
      - name: Publish portable app
        shell: powershell
        run: ./scripts/publish_windows.ps1
      - name: Build installer (same modern wizard as OrbisExtract)
        shell: powershell
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 compiler not found.' }
          & $compiler packaging/windows/hibike.iss
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Hibike-Windows-x64
          path: artifacts/Hibike-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Hibike-Windows-Setup-x64
          path: artifacts/installer/Hibike-Setup-x64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Hibike-libmpv-source
          path: artifacts/libmpv-source/*.tar.xz
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux runtime and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc5 vlc-plugin-base vlc-plugin-video-output libx11-6 libice6 libsm6 libfontconfig1 libglib2.0-0 libgl1 libxrandr2 libxi6 libxcursor1 libxext6 xvfb desktop-file-utils python3
      - name: Test core and source structure
        run: |
          python3 scripts/check_source.py
          dotnet test tests/Hibike.Core.Tests -c Release
          dotnet run --project tests/Hibike.Ui.Checks -c Release -- --headless
          dotnet run --project tests/Hibike.LocalAudio.Checks -c Release -- --presence-only
      - name: Build AppImage
        run: |
          bash scripts/publish_linux.sh
          cp packaging/linux/README.md artifacts/README-Linux.md
      - name: Check extracted AppImage startup
        env:
          HIBIKE_DISCORD_RPC: '0'
        run: |
          set -euo pipefail
          mkdir artifacts/linux-smoke
          cd artifacts/linux-smoke
          ../Hibike-x86_64.AppImage --appimage-extract > extraction.log
          test -x squashfs-root/AppRun
          test -f squashfs-root/hibike.desktop
          set +e
          timeout 15s xvfb-run -a squashfs-root/AppRun > startup.log 2>&1
          result=$?
          set -e
          cat startup.log
          if test "$result" -ne 124; then
            test "$result" -eq 0 && grep -Eq 'HIBIKE_(SMOKE|STARTUP)_OK' startup.log
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Hibike-Linux-x64
          path: |
            artifacts/Hibike-x86_64.AppImage
            artifacts/README-Linux.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Hibike-Linux-diagnostics
          path: artifacts/linux-smoke/*.log
          if-no-files-found: ignore
