name: Hibike • Windows portable and installer

on:
  push:
    branches: [main, feat/experimental-player-lab, android-player-features]
    paths: ['src/**', 'tests/**', 'scripts/**', 'packaging/**', 'LICENSE', 'Directory.*', 'global.json', 'Hibike.slnx', '.github/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'packaging/**', 'LICENSE', 'Directory.*', 'global.json', 'Hibike.slnx', '.github/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test core
        run: dotnet test tests/Hibike.Core.Tests --configuration Release
      - name: Check Discord payload
        run: dotnet run --project tests/Hibike.LocalAudio.Checks -- --presence-only
      - name: Publish portable app
        shell: powershell
        run: ./scripts/publish_windows.ps1
      - name: Build installer (same modern wizard as OrbisExtract)
        shell: powershell
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 compiler not found.' }
          & $compiler packaging/windows/hibike.iss
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Hibike-Windows-x64
          path: artifacts/Hibike-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Hibike-Windows-Setup-x64
          path: artifacts/installer/Hibike-Setup-x64.exe
          if-no-files-found: error
